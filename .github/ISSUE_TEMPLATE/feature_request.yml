name: Feature request
description: Suggest a focused improvement to a tool or workflow.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Explain the task and what is difficult today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: Describe the desired behavior and alternatives you considered.
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Processing and privacy considerations
      description: Note whether this needs server uploads, external services, persistent data, or new dependencies. Do not include private data.
